<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e293b">
    <title>MANUS AI 動能妖股雷達</title>
    <link rel="manifest" href="./manifest.webmanifest?v=2.5.1">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="src/style.css?v=2.5.1">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>
    <button id="pwa-install-btn" style="display:none; position:fixed; top:1rem; right:1rem; z-index:2000; background:#39d2c0; color:#000; border:none; padding:10px 15px; border-radius:12px; font-weight:700; box-shadow:0 10px 15px -3px rgba(0,0,0,0.3);">📲 安裝應用程式</button>
    <div class="app-container">
        <header>
            <div id="market-ticker" class="market-ticker">
                <!-- Market indices will be injected here -->
                <div class="market-item">載入市場數據中...</div>
            </div>
            <div id="update-time" style="font-size: 0.65rem; color: var(--text-secondary); margin-top: 0.5rem;">更新於: --:--:--</div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('scan')">🎯 目標掃描</button>
            <button class="tab-btn" onclick="switchTab('watchlist')">📈 監控清單</button>
        </div>

        <!-- Scan Section -->
        <section id="scan-section" class="section active">
            <div class="controls-card">
                <div id="weight-toggle" style="display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none;">
                    <h3 style="font-size: 0.9rem; margin: 0; display: flex; align-items: center; gap: 5px;">⚙️ AI 權重配置</h3>
                    <span id="weight-toggle-arrow" style="font-size: 0.8rem; color: var(--text-secondary);">展開/收合</span>
                </div>
                
                <div id="weight-controls" style="display: none; margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                    <div class="control-item">
                        <div class="control-header">
                            <span>歷史波動率</span>
                            <span id="v-w1">0</span>
                        </div>
                        <input type="range" id="w1" min="0" max="100" step="1">
                    </div>
                    <div class="control-item">
                        <div class="control-header">
                            <span>布林帶寬度</span>
                            <span id="v-w2">0</span>
                        </div>
                        <input type="range" id="w2" min="0" max="100" step="1">
                    </div>
                    <div class="control-item">
                        <div class="control-header">
                            <span>偏離 MA60</span>
                            <span id="v-w3">0</span>
                        </div>
                        <input type="range" id="w3" min="0" max="100" step="1">
                    </div>
                    <div class="control-item">
                        <div class="control-header">
                            <span>趨勢強度</span>
                            <span id="v-w4">0</span>
                        </div>
                        <input type="range" id="w4" min="0" max="100" step="1">
                    </div>
                    <div class="control-item">
                        <div class="control-header">
                            <span>偏離 MA20</span>
                            <span id="v-w5">0</span>
                        </div>
                        <input type="range" id="w5" min="0" max="100" step="1">
                    </div>
                    <div class="control-item">
                        <div class="control-header">
                            <span>偏離 BB 上軌</span>
                            <span id="v-w6">0</span>
                        </div>
                        <input type="range" id="w6" min="0" max="100" step="1">
                    </div>
                    <div class="control-item">
                        <div class="control-header">
                            <span>ROC 10日</span>
                            <span id="v-w7">0</span>
                        </div>
                        <input type="range" id="w7" min="0" max="100" step="1">
                    </div>
                </div>
                <button id="start-scan" class="btn-primary" style="margin-top: 1rem;">開始全市場掃描</button>
            </div>

            <div id="progress-container" class="progress-container">
                <div class="progress-bar-bg">
                    <div id="progress-fill" class="progress-bar-fill"></div>
                </div>
                <div id="progress-status" class="progress-status">預備中...</div>
            </div>

            <div id="results-list">
                <div style="text-align: center; padding: 3rem 1rem; color: var(--text-secondary);">
                    <div style="font-size: 2.5rem; margin-bottom: 1rem;">🔍</div>
                    <div style="font-size: 0.9rem;">全市場標的名單已就緒</div>
                    <div style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.7;">點擊下方按鈕開始 AI 權重掃描</div>
                </div>
            </div>
            <div id="monitor-all-container" style="display: none; text-align: center; margin-top: 1rem; padding-bottom: 2rem;">
                <button id="monitor-all-btn" class="btn-primary" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">一鍵全監控 (TOP 20)</button>
            </div>
        </section>

        <!-- Watchlist Section -->
        <section id="watchlist-section" class="section">
            <div id="watchlist-summary" class="controls-card" style="padding: 1rem; border-color: var(--accent-color);">
                載入中...
            </div>
            <div id="watchlist-search-container" style="margin: 0.8rem 0; display: flex; align-items: center; background: rgba(30, 41, 59, 0.7); border: 1px solid var(--border-color); border-radius: 12px; padding: 2px 12px; gap: 8px;">
                <span style="color: var(--text-secondary); font-size: 0.9rem;">🔍</span>
                <input type="text" id="watchlist-search-input" placeholder="搜尋監控個股代碼或名稱..." style="flex: 1; border: none; background: transparent; color: var(--text-primary); font-size: 0.85rem; padding: 10px 0; outline: none; box-sizing: border-box;">
                <button id="watchlist-search-clear-btn" style="display: none; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.1rem; padding: 0 4px; outline: none;">✕</button>
            </div>
            <div id="watchlist-list">
                <!-- Watchlist cards -->
            </div>
            <div id="clear-watchlist-container" style="text-align: center; margin-top: 20px; padding-bottom: 2rem; display: flex; flex-direction: column; gap: 10px; align-items: center;">
                <button id="refresh-watchlist-btn" class="btn-primary" style="background: var(--accent-color); width: 80%;">🔄 刷新現價報價</button>
                <button id="clear-watchlist-btn" class="btn-secondary" style="background: transparent; color: #ef4444; border: 1px solid #ef4444; width: 80%;">一鍵移除監控</button>
            </div>
        </section>
        
        <div class="version-tag">AI Stock Scanner v2.9.0-Nitro (2026.07.01)</div>
    </div>

    <!-- Chart Modal -->
    <div id="chart-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 id="modal-title" style="margin-bottom: 0.5rem;">股票詳情</h3>
            <div id="modal-actions" style="margin-bottom: 1rem; display: flex; gap: 10px; align-items: center;">
                <button id="add-to-watchlist-btn" class="btn-secondary" style="padding: 5px 10px; font-size: 0.8rem;">+ 加入監控</button>
                <div class="timeframe-tabs" style="display: flex; gap: 5px; flex: 1; justify-content: flex-end;">
                    <button class="tf-btn active" onclick="updateChartTimeframe('1d')">1D</button>
                    <button class="tf-btn" onclick="updateChartTimeframe('5d')">5D</button>
                    <button class="tf-btn" onclick="updateChartTimeframe('1mo')">1M</button>
                    <button class="tf-btn" onclick="updateChartTimeframe('1y')">1Y</button>
                </div>
            </div>
            <div id="chart-container" style="width: 100%; height: 200px; background: #0f172a; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary);">
                圖表功能載入中...
            </div>
            
            <!-- Financial Details Section -->
            <div id="financial-details-section" style="margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                <h4 style="font-size: 0.85rem; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 5px; color: var(--text-primary);">📊 財務與營收指標</h4>
                <div id="financial-grid" class="financial-grid">
                    <!-- PE, PB, Yield, and Revenue metrics cards will be injected here -->
                </div>
            </div>
        </div>
            
            <!-- Future Highlights & News Section -->
            <div id="outlook-section" style="margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                <h4 style="font-size: 0.85rem; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 5px; color: var(--text-primary);">🔮 未來看點與即時消息</h4>
                <div id="outlook-container" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- AI Outlook and News items will be injected here -->
                </div>
            </div>
    </div>

    <script type="module" src="src/main.js?v=2.9.0"></script>
</body>
</html>
