<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e293b">
    <title>MANUS AI 動能妖股雷達</title>
    <link rel="manifest" href="./manifest.webmanifest?v=6">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="src/style.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>
    <button id="pwa-install-btn" style="display:none; position:fixed; top:1rem; right:1rem; z-index:2000; background:#39d2c0; color:#000; border:none; padding:10px 15px; border-radius:12px; font-weight:700; box-shadow:0 10px 15px -3px rgba(0,0,0,0.3);">📲 安裝應用程式</button>
    <div class="app-container">
        <header>
            <div id="market-ticker" class="market-ticker">
                <!-- Market indices will be injected here -->
                <div class="market-item">載入市場數據中...</div>
            </div>
            <div id="update-time" style="font-size: 0.65rem; color: var(--text-secondary); margin-top: 0.5rem;">更新於: --:--:--</div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('scan')">🎯 目標掃描</button>
            <button class="tab-btn" onclick="switchTab('watchlist')">📈 監控清單</button>
        </div>

        <!-- Scan Section -->
        <section id="scan-section" class="section active">
            <div class="controls-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3 style="font-size: 0.9rem;">⚙️ 權重配置</h3>
                    <span id="weight-toggle" style="cursor: pointer; color: var(--accent-color); font-size: 0.8rem;">展開/收合</span>
                </div>
                <div id="weight-controls" style="display: none;">
                    <div class="control-item">
                        <div class="control-header"><span>歷史波動率</span><span id="v-w1">1.0</span></div>
                        <input type="range" id="w1" min="0" max="2" step="0.1" value="1.0">
                    </div>
                    <div class="control-item">
                        <div class="control-header"><span>布林帶完度</span><span id="v-w2">1.5</span></div>
                        <input type="range" id="w2" min="0" max="2" step="0.1" value="1.5">
                    </div>
                    <div class="control-item">
                        <div class="control-header"><span>偏離 MA60</span><span id="v-w3">0.8</span></div>
                        <input type="range" id="w3" min="0" max="2" step="0.1" value="0.8">
                    </div>
                    <div class="control-item">
                        <div class="control-header"><span>趨勢強度</span><span id="v-w4">2.0</span></div>
                        <input type="range" id="w4" min="0" max="2" step="0.1" value="2.0">
                    </div>
                    <div class="control-item">
                        <div class="control-header"><span>偏離 MA20</span><span id="v-w5">1.2</span></div>
                        <input type="range" id="w5" min="0" max="2" step="0.1" value="1.2">
                    </div>
                    <div class="control-item">
                        <div class="control-header"><span>偏離 BB 上軌</span><span id="v-w6">1.5</span></div>
                        <input type="range" id="w6" min="0" max="2" step="0.1" value="1.5">
                    </div>
                    <div class="control-item">
                        <div class="control-header"><span>ROC 10日</span><span id="v-w7">1.8</span></div>
                        <input type="range" id="w7" min="0" max="2" step="0.1" value="1.8">
                    </div>
                </div>
                <button id="start-scan" class="btn-primary">開始全市場掃描</button>
            </div>

            <div id="progress-container" class="progress-container">
                <div class="progress-bar-bg">
                    <div id="progress-fill" class="progress-bar-fill"></div>
                </div>
                <div id="progress-status" class="progress-status">預備中...</div>
            </div>

            <div id="results-list">
                <div style="text-align: center; padding: 3rem 1rem; color: var(--text-secondary);">
                    <div style="font-size: 2.5rem; margin-bottom: 1rem;">🔍</div>
                    <div style="font-size: 0.9rem;">全市場標的名單已就緒</div>
                    <div style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.7;">點擊下方按鈕開始 AI 權重掃描</div>
                </div>
            </div>
        </section>

        <!-- Watchlist Section -->
        <section id="watchlist-section" class="section">
            <div id="watchlist-summary" class="controls-card" style="padding: 1rem; border-color: var(--accent-color);">
                載入中...
            </div>
            <div id="watchlist-list">
                <!-- Watchlist cards -->
            </div>
        </section>
    </div>

    <!-- Chart Modal -->
    <div id="chart-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 id="modal-title" style="margin-bottom: 0.5rem;">股票詳情</h3>
            <div id="modal-actions" style="margin-bottom: 1rem; display: flex; gap: 10px; align-items: center;">
                <button id="add-to-watchlist-btn" class="btn-secondary" style="padding: 5px 10px; font-size: 0.8rem;">+ 加入監控</button>
                <div class="timeframe-tabs" style="display: flex; gap: 5px; flex: 1; justify-content: flex-end;">
                    <button class="tf-btn active" onclick="updateChartTimeframe('1d')">1D</button>
                    <button class="tf-btn" onclick="updateChartTimeframe('5d')">5D</button>
                    <button class="tf-btn" onclick="updateChartTimeframe('1mo')">1M</button>
                    <button class="tf-btn" onclick="updateChartTimeframe('1y')">1Y</button>
                </div>
            </div>
            <div id="chart-container" style="width: 100%; height: 250px; background: #0f172a; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary);">
                圖表功能載入中...
            </div>
        </div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
