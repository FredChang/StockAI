name: Stock Universe Sync

on:
  schedule:
    - cron: '0 7 * * 1-5' # 台北時間週一至週五 15:00 收盤後執行 1 次
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: stock-universe-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run sync script
        run: node scripts/sync-stocks.js
        timeout-minutes: 30

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/market.json public/scan_results.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync stock universe and scan results [$(date '+%Y-%m-%d %H:%M:%S')] [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
